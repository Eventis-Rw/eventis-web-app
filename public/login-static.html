    /* Section 7: Entrance Animation CSS Guard */
    .entry-pending .card,
    .entry-pending .badge,
    .entry-pending #hl1,
    .entry-pending #hl2,
    .entry-pending #h1,
    .entry-pending #email,
    .entry-pending #loginBtn,
    .entry-pending .divider,
    .entry-pending #gBtn,
    .entry-pending #bottom {
      opacity: 0;
      will-change: transform, opacity, clip-path;
    }

    .entry-pending .card {
      transform: translateY(12px) scale(.988);
    }
    .entry-pending .badge {
      transform: translateY(8px);
    }
    .entry-pending #hl1,
    .entry-pending #hl2 {
      transform: translateY(16px);
      clip-path: inset(100% 0 0 0);
    }
    .entry-pending #h1 {
      transform: translateY(10px);
    }
    .entry-pending #email,
    .entry-pending #loginBtn,
    .entry-pending #gBtn {
      transform: translateY(8px);
    }
    .entry-pending .divider,
    .entry-pending #bottom {
      transform: translateY(6px);
    }

    @media (max-width: 699px) {
      .entry-pending .card {
        transform: translateY(14px);
      }
      .entry-pending #hl1,
      .entry-pending #hl2 {
        transform: translateY(12px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
      .entry-pending .card,
      .entry-pending .badge,
      .entry-pending #hl1,
      .entry-pending #hl2,
      .entry-pending #h1,
      .entry-pending #email,
      .entry-pending #loginBtn,
      .entry-pending .divider,
      .entry-pending #gBtn,
      .entry-pending #bottom {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
        will-change: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- Left artwork section with responsive video variants -->
    <section class="photo" id="photoSec">
      <video class="photo-img photo-img--tall" autoplay muted loop playsinline preload="auto" poster="data:image/webp;base64,UklGRloAAABXRUJQVlA4IE4AAAAwBACdASoAAQABPyEYiEQiEREREREQAIlsAHZ34D6AAA/v1H/6b/9N/+m//Tf/pv/03/6b/9N/+m//Tf/pv/03/6b/9N/+m//Tf/pv/03/6b/9N/+m//Tf/pvgAAAA=">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_052122_e77a27e6-17f1-4794-889b-3ceaa0e9e8cb.mp4" type="video/mp4">
      </video>
      <video class="photo-img photo-img--wide" aria-hidden="true" autoplay muted loop playsinline preload="auto" poster="data:image/webp;base64,UklGRloAAABXRUJQVlA4IE4AAAAwBACdASoAAQABPyEYiEQiEREREREQAIlsAHZ34D6AAA/v1H/6b/9N/+m//Tf/pv/03/6b/9N/+m//Tf/pv/03/6b/9N/+m//Tf/pv/03/6b/9N/+m//Tf/pvgAAAA=">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_052122_e77a27e6-17f1-4794-889b-3ceaa0e9e8cb.mp4" type="video/mp4">
      </video>
      <div class="scrim"></div>
    </section>

    <!-- Right form pane with glassmorphic card -->
    <section class="pane" id="paneSec">
      <div class="card" id="card">
        <div class="card-in" id="cardIn">
          <!-- Eventis Brand Lockup -->
          <div class="card-brand">
            <svg viewBox="8 0 128 126" fill="none" aria-hidden="true">
              <circle cx="108" cy="13" r="11" fill="#00A3FF"/>
              <path fill="#00A3FF" fill-rule="evenodd" d="M63 28c-27 0-47 19-47 46s20 46 47 46c21 0 37-11 47-28l-18-9c-6 12-16 19-29 19-16 0-27-9-30-23l50-1 47-47c5-5 0-12-6-9L91 42C83 33 74 28 63 28Zm-29 35c4-13 14-20 29-20 12 0 21 6 25 17l-54 3Z"/>
            </svg>
            <span class="card-brand-name">EVENTIS</span>
          </div>

          <h1 class="col center" id="h1">Welcome Back</h1>

          <div class="field" id="email">
            <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="tel" placeholder="Enter your phone number" aria-label="Phone number">
          </div>

          <button id="loginBtn" type="button">
            <span>Login</span>
          </button>

          <p id="bottom">Don&#8217;t have an account? <a href="#">Register</a></p>
        </div>
      </div>
    </section>
  </div>

  <!-- Section 6: Responsive Engine (JS-driven, three modes) -->
  <script>
    (function () {
      var REF_W = 1464, REF_H = 949, PHOTO_W = 836, PANE_W = 628, CARD_W = 613, CARD_H = 450;
      var CONTENT_H = 500;
      var IMG_W = 1177, IMG_H = 1336, IMG_REF_SCALE = 836 / 1177;
      var PANE_RATIO = PANE_W / REF_W;
      var HERO_W = 681, HERO_H = 219;
      var REF_CARD_ASPECT = 692 / 855;
      var RAMP_HI = 1280, RAMP_LO = 1000, PHOTO_MIN = 0.42;
      var RAMP_LO2 = 820, PHOTO_MIN2 = 0.36;

      var TP = {
        "pad": 0.1076, "h1Top": 0.08656, "h1Fs": 0.06839, "subTop": 0.17368, "subFs": 0.0309,
        "emTop": 0.25435, "emH": 0.10257, "emR": 0.0202, "ephFs": 0.02702, "ephPad": 0.0332,
        "pwTop": 0.36851, "pwH": 0.10839, "btnTop": 0.50435, "btnH": 0.10981, "btnFs": 0.0275,
        "arrow": 0.026, "btnGap": 0.02, "divTop": 0.68222, "orFs": 0.02245, "orPad": 0.051,
        "divH": 0.0026, "gTop": 0.76445, "gH": 0.09966, "gIcon": 0.032, "gtFs": 0.03205,
        "gGap": 0.026, "btTop": 0.89668, "btFs": 0.02876, "heroFs": 0.1058, "badgeH": 0.0742,
        "heroLh": 1.1246, "heroBot": 0.06493, "heroGap": -0.30423, "heroSide": 0.0525
      };

      var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
      var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

      var photoEl = document.getElementById('photoSec');
      var paneEl  = document.getElementById('paneSec');
      var cardEl  = document.getElementById('card');
      var cardIn  = document.getElementById('cardIn');
      var heroEl  = document.getElementById('hero');

      var currentMode = '';

      function clearInline() {
        if (photoEl) photoEl.style.cssText = '';
        if (paneEl) paneEl.style.cssText = '';
        if (cardEl) cardEl.style.cssText = '';
        if (cardIn) cardIn.style.cssText = '';
        if (heroEl) heroEl.style.cssText = '';
      }

      function setMode(newMode) {
        if (currentMode !== newMode) {
          clearInline();
          document.body.classList.remove('tabport', 'stacked');
          if (newMode === 'tabport') document.body.classList.add('tabport');
          if (newMode === 'phone') document.body.classList.add('stacked');
          currentMode = newMode;
        }
      }

      function photoRatio(vw) {
        if (vw >= RAMP_HI) return 1 - PANE_RATIO;
        if (vw >= RAMP_LO) {
          var t = (vw - RAMP_LO) / (RAMP_HI - RAMP_LO);
          return PHOTO_MIN + t * ((1 - PANE_RATIO) - PHOTO_MIN);
        }
        if (vw >= RAMP_LO2) {
          var t2 = (vw - RAMP_LO2) / (RAMP_LO - RAMP_LO2);
          return PHOTO_MIN2 + t2 * (PHOTO_MIN - PHOTO_MIN2);
        }
        return PHOTO_MIN2;
      }

      function headlineMeasure() {
        var span = document.createElement('span');
        span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:Eloquia,sans-serif;font-size:48px;font-variation-settings:"wght" 578;';
        span.textContent = 'Discover Events to Action Instantly';
        document.body.appendChild(span);
        var w = span.getBoundingClientRect().width;
        document.body.removeChild(span);
        return w || 600;
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        if (vw < 700) {
          // Mode C: Phone (<700px) - pure document flow
          setMode('phone');
          return;
        }

        if (mqPortrait.matches) {
          // Mode B: Tablet Portrait (>=700px, portrait)
          setMode('tabport');

          var bandH = Math.round(vh * 0.425);
          var heroSide = Math.round(vw * TP.heroSide);
          var badgeK = (bandH * TP.badgeH) / 37;
          var heroGap = Math.round(bandH * TP.heroGap);
          var heroB = Math.round(bandH * TP.heroBot);
          var hlMeasure = Math.round(headlineMeasure() * 0.61);

          document.documentElement.style.setProperty('--band-h', bandH + 'px');
          document.documentElement.style.setProperty('--tp-hero-side', heroSide + 'px');
          document.documentElement.style.setProperty('--badge-k', badgeK);
          document.documentElement.style.setProperty('--tp-hero-gap', heroGap + 'px');
          document.documentElement.style.setProperty('--tp-hero-b', heroB + 'px');
          document.documentElement.style.setProperty('--tp-hl-measure', hlMeasure + 'px');

          var cardRect = cardEl.getBoundingClientRect();
          var cardW = cardRect.width;
          var cardH = cardRect.height;
          var S = Math.min(cardH, cardW * REF_CARD_ASPECT);

          for (var k in TP) {
            if (!Object.prototype.hasOwnProperty.call(TP, k)) continue;
            var kebab = k.replace(/([A-Z])/g, '-$1').toLowerCase();
            var val = TP[k];
            var computedPx = val * S;
            if (k === 'pad' || k === 'orPad') computedPx = val * cardW;
            else if (k.indexOf('Top') !== -1 || k.indexOf('H') !== -1) computedPx = val * cardH;
            document.documentElement.style.setProperty('--tp-' + kebab, computedPx + 'px');
          }
          return;
        }

        // Mode A: Desktop Landscape (>=700px, landscape)
        setMode('land');

        var pr = photoRatio(vw);
        var photoW = Math.round(vw * pr);
        var paneW = vw - photoW;

        photoEl.style.width = photoW + 'px';
        paneEl.style.left = photoW + 'px';

        // placeCard (vertically & horizontally centered in pane)
        var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
        var cw = Math.min(CARD_W * cs, paneW - 28 * cs);
        var ch = Math.min(CARD_H * cs, vh - 28 * cs);
        var left = (paneW - cw) / 2;
        var top = (vh - ch) / 2;

        cardEl.style.left = left + 'px';
        cardEl.style.top = top + 'px';
        cardEl.style.width = cw + 'px';
        cardEl.style.height = ch + 'px';
        cardEl.style.borderRadius = (26 * cs) + 'px';
        cardEl.style.borderWidth = Math.max(1, cs) + 'px';

        var tx = (cw - CARD_W * cs) / 2;
        var ty = (ch - CARD_H * cs) / 2;
        cardIn.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + cs + ')';
        document.documentElement.style.setProperty('--cs', cs);

        // seatHero
        var imgScale = Math.max(photoW / IMG_W, vh / IMG_H);
        var sHero = Math.min(imgScale / IMG_REF_SCALE, (photoW * 0.92) / HERO_W);
        heroEl.style.transform = 'scale(' + sHero + ')';
        heroEl.style.transformOrigin = 'left bottom';
        heroEl.style.bottom = '0px';
      }

      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout);
      if (mqLandscape.addEventListener) {
        mqLandscape.addEventListener('change', layout);
        mqPortrait.addEventListener('change', layout);
      } else if (mqLandscape.addListener) {
        mqLandscape.addListener(layout);
        mqPortrait.addListener(layout);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout);
      }
      layout();
    })();
  </script>

  <!-- Section 7: Staggered WAAPI Entrance Animation (Runs once on load) -->
  <script>
    (function () {
      function releaseEntrance() {
        if (window.__entryFallback) clearTimeout(window.__entryFallback);
        document.documentElement.classList.remove('entry-pending');
      }

      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced || !('animate' in Element.prototype)) {
        releaseEntrance();
        return;
      }

      var ease = 'cubic-bezier(.16, 1, .3, 1)';
      var softEase = 'cubic-bezier(.22, 1, .36, 1)';
      var compact = window.matchMedia('(max-width:699px)').matches;

      var steps = [
        { sel: '.card', delay: 40, dur: 820, fn: ease, from: { opacity: 0, transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(.988)' } },
        { sel: '#h1', delay: 180, dur: 620, fn: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
        { sel: '#email', delay: 320, dur: 520, fn: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
        { sel: '#loginBtn', delay: 460, dur: 560, fn: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
        { sel: '#bottom', delay: 600, dur: 500, fn: softEase, from: { opacity: 0, transform: 'translateY(6px)' } }
      ];

      var fontRace = Promise.race([
        document.fonts ? document.fonts.ready : Promise.resolve(),
        new Promise(function (r) { setTimeout(r, 650); })
      ]);

      fontRace.then(function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var animations = [];

            steps.forEach(function (step) {
              var el = document.querySelector(step.sel);
              if (!el) return;
              var toState = { opacity: 1, transform: 'none' };
              if (step.toExtra) Object.assign(toState, step.toExtra);

              var anim = el.animate([step.from, toState], {
                delay: step.delay,
                duration: step.dur,
                easing: step.fn,
                fill: 'both'
              });
              animations.push(anim);
            });

            // Handoff: Drop the CSS entry-pending class immediately so WAAPI owns initial frames
            releaseEntrance();

            // When all WAAPI animations settle, cancel to eliminate fill:both residue
            Promise.allSettled(animations.map(function (a) { return a.finished; })).then(function () {
              animations.forEach(function (a) {
                try { a.cancel(); } catch (e) {}
              });
              animations = [];
            });
          });
        });
      });
    })();

    // Enforce numbers-only on phone input
    (function () {
      var phoneInput = document.querySelector('#email input');
      if (phoneInput) {
        phoneInput.addEventListener('keydown', function (e) {
          if (['Backspace', 'Delete', 'Tab', 'Escape', 'Enter', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1 || e.ctrlKey || e.metaKey) return;
          if (!/^\d$/.test(e.key)) e.preventDefault();
        });
        phoneInput.addEventListener('input', function () {
          this.value = this.value.replace(/\D/g, '');
        });
      }
    })();
  </script>
